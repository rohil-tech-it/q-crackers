<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q Crackers — Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- FAVICON / TAB LOGO -->
    <link rel="icon" type="image/png" href="../images/logo-removebg-preview.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --bg-white: #ffffff;
            --bg-elevated: #ffffff;
            --card: #e60000;
            --card-hover: #c40000;
            --border: rgba(230, 0, 0, 0.12);
            --border-strong: rgba(230, 0, 0, 0.30);
            --yellow: #ffd400;
            --yellow-bright: #fff04d;
            --ember: #ff0000;
            --ember-soft: rgba(255, 0, 0, 0.15);
            --text: #1f1f1f;
            --text-muted: #555555;
            --text-dim: #888888;
            --radius: 16px;
            --radius-sm: 10px;
            --max-w: 1200px;
            --shadow-glow: 0 0 30px rgba(230, 0, 0, 0.25);
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0000;
            overflow: hidden;
        }

        /* ============================================================
           CRACKER / FIREWORKS BACKGROUND ANIMATION
           ============================================================ */
        .fireworks-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center,
                    #ff0000 0%,
                    #e60000 30%,
                    #cc0000 60%,
                    #b30000 100%);
            overflow: hidden;
        }

        .burst-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .cracker-burst {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            animation: burstExplode 4s ease-out infinite;
            opacity: 0;
        }

        .cracker-burst::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle,
                    rgba(255, 212, 0, 0.4) 0%,
                    rgba(255, 200, 0, 0.2) 20%,
                    rgba(255, 100, 0, 0.1) 40%,
                    transparent 70%);
            animation: burstPulse 4s ease-out infinite;
        }

        .cracker-burst::after {
            content: '';
            position: absolute;
            inset: 20%;
            border-radius: 50%;
            background: radial-gradient(circle,
                    rgba(255, 255, 255, 0.3) 0%,
                    rgba(255, 212, 0, 0.15) 30%,
                    transparent 70%);
            animation: burstInner 4s ease-out infinite;
        }

        .sparkle-ray {
            position: absolute;
            width: 2px;
            height: 100px;
            background: linear-gradient(to top, rgba(255, 212, 0, 0.6), transparent);
            border-radius: 50%;
            transform-origin: bottom center;
            animation: rayShoot 3s ease-out infinite;
            opacity: 0;
        }

        .sparkle-ray:nth-child(1) {
            transform: rotate(0deg) translateY(-50px);
            animation-delay: 0s;
        }

        .sparkle-ray:nth-child(2) {
            transform: rotate(45deg) translateY(-50px);
            animation-delay: 0.2s;
        }

        .sparkle-ray:nth-child(3) {
            transform: rotate(90deg) translateY(-50px);
            animation-delay: 0.4s;
        }

        .sparkle-ray:nth-child(4) {
            transform: rotate(135deg) translateY(-50px);
            animation-delay: 0.6s;
        }

        .sparkle-ray:nth-child(5) {
            transform: rotate(180deg) translateY(-50px);
            animation-delay: 0.8s;
        }

        .sparkle-ray:nth-child(6) {
            transform: rotate(225deg) translateY(-50px);
            animation-delay: 1.0s;
        }

        .sparkle-ray:nth-child(7) {
            transform: rotate(270deg) translateY(-50px);
            animation-delay: 1.2s;
        }

        .sparkle-ray:nth-child(8) {
            transform: rotate(315deg) translateY(-50px);
            animation-delay: 1.4s;
        }

        .cracker-burst:nth-child(1) {
            top: 10%;
            left: 5%;
            animation-delay: 0s;
            width: 250px;
            height: 250px;
        }

        .cracker-burst:nth-child(2) {
            top: 60%;
            left: 75%;
            animation-delay: 2s;
            width: 350px;
            height: 350px;
        }

        .cracker-burst:nth-child(3) {
            top: 80%;
            left: 10%;
            animation-delay: 4s;
            width: 200px;
            height: 200px;
        }

        .cracker-burst:nth-child(4) {
            top: 20%;
            left: 80%;
            animation-delay: 1s;
            width: 280px;
            height: 280px;
        }

        .cracker-burst:nth-child(5) {
            top: 50%;
            left: 45%;
            animation-delay: 3s;
            width: 400px;
            height: 400px;
        }

        .cracker-burst:nth-child(6) {
            top: 85%;
            left: 50%;
            animation-delay: 5s;
            width: 220px;
            height: 220px;
        }

        @keyframes burstExplode {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }

            10% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.5);
            }

            100% {
                opacity: 0;
                transform: scale(2.5);
            }
        }

        @keyframes burstPulse {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            20% {
                opacity: 0.8;
                transform: scale(1);
            }

            60% {
                opacity: 0.5;
                transform: scale(1.5);
            }

            100% {
                opacity: 0;
                transform: scale(2);
            }
        }

        @keyframes burstInner {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }

            30% {
                opacity: 0.6;
                transform: scale(1.2);
            }

            70% {
                opacity: 0.3;
                transform: scale(1.8);
            }

            100% {
                opacity: 0;
                transform: scale(2.5);
            }
        }

        @keyframes rayShoot {
            0% {
                opacity: 0;
                height: 0;
            }

            20% {
                opacity: 1;
                height: 60px;
            }

            60% {
                opacity: 0.6;
                height: 150px;
            }

            100% {
                opacity: 0;
                height: 200px;
            }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--yellow);
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(255, 212, 0, 0.3);
            animation: floatSparkle linear infinite;
            opacity: 0;
        }

        .sparkle:nth-child(1) {
            left: 15%;
            animation-duration: 8s;
            animation-delay: 0s;
            width: 3px;
            height: 3px;
        }

        .sparkle:nth-child(2) {
            left: 30%;
            animation-duration: 10s;
            animation-delay: 2s;
            width: 5px;
            height: 5px;
        }

        .sparkle:nth-child(3) {
            left: 45%;
            animation-duration: 7s;
            animation-delay: 4s;
            width: 2px;
            height: 2px;
        }

        .sparkle:nth-child(4) {
            left: 60%;
            animation-duration: 12s;
            animation-delay: 1s;
            width: 4px;
            height: 4px;
        }

        .sparkle:nth-child(5) {
            left: 75%;
            animation-duration: 9s;
            animation-delay: 3s;
            width: 3px;
            height: 3px;
        }

        .sparkle:nth-child(6) {
            left: 90%;
            animation-duration: 11s;
            animation-delay: 5s;
            width: 5px;
            height: 5px;
        }

        .sparkle:nth-child(7) {
            left: 5%;
            animation-duration: 13s;
            animation-delay: 2s;
            width: 2px;
            height: 2px;
        }

        .sparkle:nth-child(8) {
            left: 50%;
            animation-duration: 6s;
            animation-delay: 6s;
            width: 4px;
            height: 4px;
        }

        .sparkle:nth-child(9) {
            left: 70%;
            animation-duration: 14s;
            animation-delay: 1s;
            width: 3px;
            height: 3px;
        }

        .sparkle:nth-child(10) {
            left: 25%;
            animation-duration: 8s;
            animation-delay: 7s;
            width: 5px;
            height: 5px;
        }

        @keyframes floatSparkle {
            0% {
                top: -5%;
                opacity: 0;
                transform: translateX(0) scale(0);
            }

            10% {
                opacity: 1;
                transform: scale(1);
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 105%;
                opacity: 0;
                transform: translateX(30px) scale(0);
            }
        }

        /* ============================================================
           LOADING SCREEN
           ============================================================ */
        #auth-loading {
            position: fixed;
            inset: 0;
            background: #0a0000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        #auth-loading .spinner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid rgba(255, 212, 0, 0.1);
            border-top: 3px solid var(--yellow);
            border-right: 3px solid var(--card);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
           LOGIN SCREEN
           ============================================================ */
        #login-screen {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        #login-screen.active {
            display: flex;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 212, 0, 0.25);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 212, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            padding: 44px 40px;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--card), var(--yellow), var(--card), var(--yellow));
            background-size: 300% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 0%;
            }
        }

        /* ===== BRAND ===== */
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .login-brand .brand-icon {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--yellow), var(--yellow-bright));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 2rem;
            color: #8B0000;
            box-shadow: 0 8px 32px rgba(255, 212, 0, 0.3);
            position: relative;
            transition: transform 0.3s ease;
        }

        .login-brand .brand-icon:hover {
            transform: scale(1.08) rotate(-5deg);
        }

        .login-brand .brand-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(255, 212, 0, 0.2);
            animation: pulseRing 2s ease-in-out infinite;
        }

        @keyframes pulseRing {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.12);
                opacity: 0.4;
            }
        }

        .login-brand .brand-title {
            font-family: 'Anton', sans-serif;
            font-weight: 400;
            font-size: 1.9rem;
            letter-spacing: 1px;
            color: var(--text);
        }

        .login-brand .brand-title span {
            color: var(--card);
        }

        .login-brand .brand-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 500;
            background: rgba(230, 0, 0, 0.06);
            padding: 4px 16px;
            border-radius: 999px;
            border: 1px solid rgba(230, 0, 0, 0.08);
        }

        /* ===== FORM ===== */
        .login-field {
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        .login-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-field label i {
            color: var(--card);
            margin-right: 6px;
        }

        .login-field .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f8f4f2;
            border-radius: var(--radius-sm);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .login-field .input-wrapper:focus-within {
            border-color: var(--yellow);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255, 212, 0, 0.1);
        }

        .login-field .input-wrapper .input-icon {
            padding: 0 0 0 16px;
            color: var(--text-dim);
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .login-field .input-wrapper:focus-within .input-icon {
            color: var(--yellow);
        }

        .login-field .input-wrapper input {
            width: 100%;
            padding: 13px 16px 13px 12px;
            border: none;
            background: transparent;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            color: var(--text);
            outline: none;
        }

        .login-field .input-wrapper input::placeholder {
            color: #bbb;
            font-weight: 300;
        }

        /* ===== PASSWORD TOGGLE ===== */
        .login-field .input-wrapper .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 6px;
            transition: color 0.2s;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-field .input-wrapper .toggle-password:hover {
            color: var(--yellow);
        }

        .login-field .input-wrapper .toggle-password.active {
            color: var(--yellow);
        }

        .login-field .input-wrapper .toggle-password i {
            font-size: 1rem;
        }

        /* ===== ERROR ===== */
        .login-error {
            display: none;
            align-items: center;
            gap: 10px;
            color: #c0392b;
            background: rgba(231, 76, 60, 0.06);
            border: 1px solid rgba(231, 76, 60, 0.15);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 0.8rem;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
            animation: shake 0.4s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        .login-error.show {
            display: flex;
        }

        /* ===== SUBMIT ===== */
        .login-submit {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--yellow), var(--yellow-bright));
            color: #8B0000;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .login-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--yellow-bright), var(--yellow));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .login-submit:hover::before {
            opacity: 1;
        }

        .login-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 212, 0, 0.35);
        }

        .login-submit:active {
            transform: translateY(0px) scale(0.98);
        }

        .login-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-submit .btn-text,
        .login-submit .btn-spinner {
            position: relative;
            z-index: 1;
        }

        .login-submit .btn-spinner {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(139, 0, 0, 0.2);
            border-top-color: #8B0000;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        .login-submit.loading .btn-spinner {
            display: inline-block;
        }

        .login-submit.loading .btn-text {
            display: none;
        }

        /* ===== FOOTER ===== */
        .login-footer {
            margin-top: 24px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .login-footer .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .login-footer .divider::before,
        .login-footer .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .login-footer .divider span {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .login-note {
            font-size: 0.7rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-note i {
            color: var(--yellow);
            font-size: 0.8rem;
        }

        .login-note strong {
            color: var(--card);
            font-weight: 600;
        }

        /* ===== VERSION BADGE ===== */
        .badge-version {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 0.55rem;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.04);
            padding: 3px 10px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            z-index: 2;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            .login-brand .brand-title {
                font-size: 1.5rem;
            }

            .login-brand .brand-icon {
                width: 56px;
                height: 56px;
                font-size: 1.5rem;
            }

            .login-field input {
                font-size: 0.9rem;
                padding: 11px 14px 11px 10px;
            }

            .login-submit {
                font-size: 0.85rem;
                padding: 12px;
            }

            .login-field .input-wrapper .toggle-password {
                right: 8px;
            }
        }

        @media (max-width: 360px) {
            .login-card {
                padding: 24px 16px;
            }

            .login-brand .brand-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>

        <div class="sparkle"></div>

    <!-- ============================================================

        <div class="login-wrapper">
            <div class="login-card">
                <span class="badge-version"><i class="fas fa-fire"></i> v2.0</span>

                <div class="login-brand">
                    <div class="brand-icon">Q</div>
                    <div class="brand-title">Q <span>Crackers</span></div>
                    <span class="brand-sub"><i class="fas fa-crown"></i> Admin Portal</span>
                </div>

                <p class="login-error" id="loginError">
                    <i class="fas fa-exclamation-circle"></i> <span></span>
                </p>

                <form id="loginForm">
                    <div class="login-field">
                        <label><i class="fas fa-envelope"></i> Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-envelope"></i></span>
                            <input type="email" id="loginEmail" placeholder="admin@qcrackers.in" required
                                autocomplete="username" />
                        </div>
                    </div>

                    <div class="login-field">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-lock"></i></span>
                            <input type="password" id="loginPassword" placeholder="Enter your password" required
                                autocomplete="current-password" />
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="login-submit" id="loginSubmitBtn">
                        <span class="btn-spinner"></span>
                        <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login to Dashboard</span>
                    </button>

                        <span><i class="fas fa-fire"></i> Secure Access</span>

                    <p class="login-note">
                        <i class="fas fa-shield-alt"></i>
                        <strong>Q Crackers</strong>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
       FIREBASE AUTH
       ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js"
            }
        }
    </script>

    <script type="module">
        import {initializeApp} from "firebase/app";
        import {
            getAuth,
            signInWithEmailAndPassword,
            setPersistence,
            browserLocalPersistence
        } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyAJo1hyj4nDX890w5dTtlFoMMa5fnY_c-0",
            authDomain: "qcrackers.firebaseapp.com",
            projectId: "qcrackers",
            storageBucket: "qcrackers.firebasestorage.app",
            messagingSenderId: "491899224672",
            appId: "1:491899224672:web:acc45f1e3cb5f4af1bb905"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const authLoading = document.getElementById('auth-loading');
        const loginScreen = document.getElementById('login-screen');
        const loginForm = document.getElementById('loginForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        const loginError = document.getElementById('loginError');

        // ============================================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================================
        window.togglePasswordVisibility = function () {
            const input = document.getElementById('loginPassword');
            const button = document.querySelector('.toggle-password');
            const icon = button.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                button.classList.add('active');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                button.classList.remove('active');
            }
        };

        function showError(msg) {
            const span = loginError.querySelector('span');
            if (span) span.textContent = msg;
            loginError.classList.add('show');
            setTimeout(() => loginError.classList.remove('show'), 5000);
        }

        function clearError() {
            loginError.classList.remove('show');
        }

        function friendlyError(code) {
            switch (code) {
                case 'auth/invalid-email':
                    return 'Please enter a valid email address.';
                case 'auth/user-not-found':
                case 'auth/invalid-credential':
                case 'auth/wrong-password':
                    return 'Incorrect email or password. Please try again.';
                case 'auth/too-many-requests':
                    return 'Too many failed attempts. Please try again later.';
                default:
                    return 'Login failed. Please check your credentials.';
            }
        }

        // ============================================================
        // AUTH INITIALIZATION
        // ============================================================

        setPersistence(auth, browserLocalPersistence)
            .then(() => {

                // IMPORTANT:
                // /admin page must ALWAYS show the login screen.
                // Even if Firebase already has a logged-in user.

                authLoading.style.display = 'none';
                loginScreen.classList.add('active');

                // Clear previous form values
                loginForm.reset();
                clearError();

            })
            .catch((err) => {

                console.error('Persistence error:', err);

                authLoading.style.display = 'none';
                loginScreen.classList.add('active');

            });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            clearError();

            const email = loginEmail.value.trim();
            const password = loginPassword.value;

            if (!email || !password) {
                showError('Please enter both email and password.');
                return;
            }

            loginSubmitBtn.disabled = true;
            loginSubmitBtn.classList.add('loading');

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {

                    window.location.href = '/admin/dashboard.html';
                })
                .catch(err => {
                    showError(friendlyError(err.code));
                })
                .finally(() => {
                    loginSubmitBtn.disabled = false;
                    loginSubmitBtn.classList.remove('loading');
                });
        });

        // Enter key support
        loginPassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        loginEmail.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                loginPassword.focus();
            }
        });
    </script>
</body>

</html>
