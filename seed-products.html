            border-radius: 999px;

            background: linear-gradient(90deg, #d4af37, #f7d774);
            border-radius: 999px;

            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }

        .status-badge.error {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        // ============================================================
        // GET IMAGE URL
        // ============================================================
        async function getImageUrl(filename) {
            if (!filename) return null;
            try {
                const storageRef = ref(storage, `products/${filename}`); const url = await getDownloadURL(storageRef);
                return url;
            } catch (error) {
                console.warn(`⚠️ Failed to get URL for ${filename}:`, error.message);
                return null;
            }
        }

        // ============================================================
        // UPDATE TOTAL COUNT
        // ============================================================
        window.refreshCount = async function () {
            try {
                const productsRef = collection(db, 'products');
                const snapshot = await getDocs(productsRef);
                const count = snapshot.size;
                document.getElementById('totalCount').textContent = count;
                return count;
            } catch (error) {
                console.error('Failed to get product count:', error);
                return 0;
            }
        };

        // ============================================================
        // CLEAR ALL PRODUCTS
        // ============================================================
        window.clearAllProducts = async function () {
            const log = document.getElementById('log');
            const clearBtn = document.getElementById('clearBtn');
            const seedBtn = document.getElementById('seedBtn');

            function addLog(msg, type = '') {
                const p = document.createElement('p');
                const time = new Date().toLocaleTimeString();
                p.textContent = `[${time}] ${msg}`;
                if (type) p.className = type;
                log.appendChild(p);
                log.scrollTop = log.scrollHeight;
                console.log(msg);
            }

            clearBtn.disabled = true;
            seedBtn.disabled = true;
            clearBtn.textContent = '🗑️ Deleting...';

            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = 'Deleting...';
            statusBadge.className = 'status-badge running';

            try {
                const productsRef = collection(db, 'products');
                const snapshot = await getDocs(productsRef);

                if (snapshot.empty) {
                    addLog('✅ No products to delete', 'warning');
                    await window.refreshCount();
                    statusBadge.textContent = 'Empty';
                    statusBadge.className = 'status-badge idle';
                    return;
                }

                addLog(`🗑️ Found ${snapshot.size} products to delete`);

                let deleted = 0;
                const total = snapshot.size;

                for (const doc of snapshot.docs) {
                    await deleteDoc(doc.ref);
                    deleted++;
                    if (deleted % 10 === 0 || deleted === total) {
                        addLog(`🗑️ Deleted ${deleted}/${total} products`);
                    }
                }

                await window.refreshCount();
                document.getElementById('seededCount').textContent = '0';
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressFill').className = 'fill';

                addLog(`✅ Successfully deleted ${deleted} products`, 'success');
                statusBadge.textContent = 'Cleared';
                statusBadge.className = 'status-badge done';

            } catch (error) {
                addLog(`❌ Error clearing products: ${error.message}`, 'error');
                console.error('Clear error:', error);
                statusBadge.textContent = 'Error';
                statusBadge.className = 'status-badge error';
            } finally {
                clearBtn.disabled = false;
                seedBtn.disabled = false;
                clearBtn.textContent = '🗑️ Clear All';
            }
        };

        // ============================================================
        // SEED FUNCTION
        // ============================================================
        window.seedAllProducts = async function () {
            const log = document.getElementById('log');
            const seedBtn = document.getElementById('seedBtn');
            const clearBtn = document.getElementById('clearBtn');
            const progressFill = document.getElementById('progressFill');
            const seededCount = document.getElementById('seededCount');
            const statusBadge = document.getElementById('statusBadge');

            function addLog(msg, type = '') {
                const p = document.createElement('p');
                const time = new Date().toLocaleTimeString();
                p.textContent = `[${time}] ${msg}`;
                if (type) p.className = type;
                log.appendChild(p);
                log.scrollTop = log.scrollHeight;
                console.log(msg);
            }

            log.innerHTML = '';
            seedBtn.disabled = true;
            clearBtn.disabled = true;
            seedBtn.textContent = '⏳ Seeding 225 products...';
            statusBadge.textContent = 'Running...';
            statusBadge.className = 'status-badge running';
            progressFill.style.width = '0%';
            progressFill.className = 'fill';
            seededCount.textContent = '0';

            let seeded = 0;
            let failed = 0;

            try {
                addLog('🔥 Starting complete product seeding...');
                addLog(`📦 Total products to seed: ${allProducts.length}`);

                // Get image URLs
                addLog('📸 Fetching unique image URLs from Firebase Storage...');
                const imageCache = {};
                const uniqueFiles = [...new Set(Object.values(productImageMap).filter(f => f))];
                let loadedImages = 0;

                for (const filename of uniqueFiles) {
                    const url = await getImageUrl(filename);
                    if (url) {
                        imageCache[filename] = url;
                        loadedImages++;
                        if (loadedImages % 10 === 0 || loadedImages === uniqueFiles.length) {
                            addLog(`📸 Loaded ${loadedImages}/${uniqueFiles.length} images`, 'info');
                        }
                    } else {
                        imageCache[filename] = null;
                        addLog(`⚠️ Could not load: ${filename}`, 'warning');
                    }
                }

                addLog(`📸 Loaded ${loadedImages}/${uniqueFiles.length} images successfully`, 'success');

                // Seed all products
                addLog('🌱 Starting to seed products...');
                const total = allProducts.length;

                for (let i = 0; i < total; i++) {
                    const product = allProducts[i];
                    const filename = productImageMap[product.name] || null;
                    const imageUrl = filename ? imageCache[filename] || null : null;

                    const productData = {
                        name: product.name,
                        category: product.category,
                        price: product.price,
                        oldPrice: product.oldPrice,
                        sub: product.sub,
                        imageUrl: imageUrl,
                        imageFilename: filename || null,
                        createdAt: new Date().toISOString(),
                        orderIndex: i + 1
                    };

                    try {
                        await addDoc(collection(db, 'products'), productData);
                        seeded++;

                        // Update progress
                        const progress = ((i + 1) / total) * 100;
                        progressFill.style.width = `${progress}%`;
                        seededCount.textContent = seeded;

                        if (i % 10 === 0 || i === total - 1) {
                            addLog(`✅ Seeded ${seeded}/${total} products (${Math.round(progress)}%)`, 'success');
                        }
                    } catch (error) {
                        failed++;
                        addLog(`❌ Failed to seed "${product.name}": ${error.message}`, 'error');
                        console.error(`Failed to seed product ${i + 1}:`, error);
                    }
                }

                // Update final stats
                const finalCount = await window.refreshCount();

                addLog(`✅ Seeding complete! ${seeded} seeded, ${failed} failed. Total in DB: ${finalCount}`, 'success');

                // Update UI
                seedBtn.textContent = '✅ Seeding Complete!';
                seedBtn.style.background = '#2ecc71';
                seedBtn.style.color = '#fff';
                progressFill.className = 'fill success';
                statusBadge.textContent = 'Done ✅';
                statusBadge.className = 'status-badge done';

                // Show summary
                addLog(`📊 Summary:`, 'info');
                addLog(`  - Products seeded: ${seeded}`, 'success');
                addLog(`  - Products failed: ${failed}`, failed > 0 ? 'error' : 'success');
                addLog(`  - Images loaded: ${loadedImages}/${uniqueFiles.length}`, loadedImages === uniqueFiles.length ? 'success' : 'warning');

            } catch (error) {
                addLog(`💥 Fatal error: ${error.message}`, 'error');
                console.error('Seeding error:', error);
                seedBtn.textContent = '❌ Seeding Failed';
                seedBtn.style.background = '#e74c3c';
                seedBtn.style.color = '#fff';
                progressFill.className = 'fill error';
                statusBadge.textContent = 'Error ❌';
                statusBadge.className = 'status-badge error';
            } finally {
                seedBtn.disabled = false;
                clearBtn.disabled = false;

                // Reset button after 10 seconds
                setTimeout(() => {
                    if (seedBtn.textContent.includes('Complete') || seedBtn.textContent.includes('Failed')) {
                        seedBtn.textContent = '🌱 Seed All 225 Products';
                        seedBtn.style.background = '';
                        seedBtn.style.color = '';
                        progressFill.className = 'fill';
                        if (statusBadge.textContent.includes('Done') || statusBadge.textContent.includes('Error')) {
                            statusBadge.textContent = 'Idle';
                            statusBadge.className = 'status-badge idle';
                        }
                    }
                }, 10000);
            }
        };

        // ============================================================
        // INITIALIZATION
        // ============================================================
        // Load product count on page load
        window.addEventListener('DOMContentLoaded', async () => {
            await window.refreshCount();
        });

        // Make functions available globally
        window.seedAllProducts = window.seedAllProducts;
        window.clearAllProducts = window.clearAllProducts;
        window.refreshCount = window.refreshCount;

        console.log('🌱 Q Crackers Seed Tool Ready');
        console.log(`📦 Total products defined: ${allProducts.length}`);
        console.log(`🖼️ Unique images: ${Object.keys(productImageMap).length}`);
    </script>
